<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
      margin: 24px;
      background: #f7f7f7;
      color: #222;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    button {
      margin: 12px 8px 12px 0;
      padding: 8px 14px;
      border: 1px solid #222;
      border-radius: 4px;
      background: #222;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    #status {
      margin: 12px 0;
      padding: 10px 12px;
      border-radius: 6px;
      background: #fff;
      border: 1px solid #ddd;
    }

    #metadata {
      background: #111;
      color: #eee;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px;
      min-height: 42px;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      margin-top: 16px;
      border: 1px solid #ddd;
      background: #fff;
    }

    table {
      width: 100%;
      min-width: 1100px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 8px;
      border-bottom: 1px solid #eee;
      vertical-align: middle;
      text-align: left;
      font-size: 13px;
      max-width: 360px;
      overflow-wrap: anywhere;
    }

    th {
      background: #fafafa;
      font-weight: 700;
      white-space: nowrap;
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .thumb {
      width: 120px;
      height: 68px;
      object-fit: cover;
      border-radius: 4px;
      background: #ddd;
      display: block;
    }

    .muted {
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <h1>YouTube Data API PoC</h1>
  <div class="muted">
    対象チャンネル <code>@hayayabo</code> の uploads playlist から公開動画データを取得し、Google Sheets に保存します。
  </div>

  <div>
    <button id="refresh-button" type="button">YouTubeから取得</button>
    <button id="load-button" type="button">Spreadsheetを確認</button>
  </div>

  <div id="status">初期化中...</div>
  <pre id="metadata"></pre>

  <div class="table-wrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script>
    const $ = (selector) => document.querySelector(selector);

    function setStatus(message) {
      $('#status').textContent = message;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[ch]));
    }

    function gasRun(functionName, ...args) {
      return new Promise((resolve, reject) => {
        window.google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)[functionName](...args);
      });
    }

    function isNumericColumn(column) {
      return [
        'duration_sec',
        'view_count',
        'like_count',
        'comment_count',
        'current_concurrent_viewers'
      ].includes(column);
    }

    function renderRows(rows) {
      if (!rows || rows.length === 0) {
        $('#thead').innerHTML = '';
        $('#tbody').innerHTML = '';
        return;
      }

      const columns = Object.keys(rows[0]);

      $('#thead').innerHTML = `<tr>${columns.map((column) => `<th>${escapeHtml(column)}</th>`).join('')}</tr>`;
      $('#tbody').innerHTML = rows.map((row) => `
        <tr>
          ${columns.map((column) => {
            const value = row[column];

            if (column === 'thumbnail_url' && value) {
              return `
                <td>
                  <img
                    class="thumb"
                    src="${escapeHtml(value)}"
                    loading="lazy"
                    decoding="async"
                    width="120"
                    height="68"
                    onerror="this.style.display='none'"
                  >
                </td>
              `;
            }

            const className = isNumericColumn(column) ? ' class="num"' : '';
            return `<td${className}>${escapeHtml(value)}</td>`;
          }).join('')}
        </tr>
      `).join('');
    }

    function renderMetadata(value) {
      $('#metadata').textContent = JSON.stringify(value, null, 2);
    }

    async function initialize() {
      setStatus('設定を取得中...');
      const config = await gasRun('getPocConfig');
      renderMetadata(config);

      if (!config.hasYouTubeApiKey) {
        setStatus('ERROR: Script property YOUTUBE_API_KEY が未設定です。README.md の手順で設定してください。');
        return;
      }

      await loadSpreadsheet();
    }

    async function refreshData() {
      $('#refresh-button').disabled = true;
      $('#load-button').disabled = true;

      try {
        setStatus('YouTube Data API から取得中...');
        const result = await gasRun('manualRefresh');
        renderMetadata(result);
        renderRows(result.previewRows);
        setStatus(`OK: ${result.rowCount.toLocaleString('ja-JP')} 件を Spreadsheet に保存しました。`);
      } finally {
        $('#refresh-button').disabled = false;
        $('#load-button').disabled = false;
      }
    }

    async function loadSpreadsheet() {
      setStatus('Spreadsheet の保存済みデータを確認中...');
      const result = await gasRun('getLatestRows', 20);
      renderMetadata(result);
      renderRows(result.rows);

      if (result.spreadsheet) {
        setStatus(`OK: Spreadsheet から ${result.rows.length} 件を表示しています。`);
      } else {
        setStatus('Spreadsheet はまだ作成されていません。YouTubeから取得を実行してください。');
      }
    }

    $('#refresh-button').addEventListener('click', () => {
      refreshData().catch((error) => {
        console.error(error);
        setStatus(`ERROR: ${error.message || error}`);
        $('#metadata').textContent = String(error.stack || error);
      });
    });

    $('#load-button').addEventListener('click', () => {
      loadSpreadsheet().catch((error) => {
        console.error(error);
        setStatus(`ERROR: ${error.message || error}`);
        $('#metadata').textContent = String(error.stack || error);
      });
    });

    initialize().catch((error) => {
      console.error(error);
      setStatus(`ERROR: ${error.message || error}`);
      $('#metadata').textContent = String(error.stack || error);
    });
  </script>
</body>
</html>
