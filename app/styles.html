  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a1f;
      --panel-2: #1f242b;
      --panel-3: #242b34;
      --line: #2b3038;
      --line-soft: #22272e;
      --text: #e8eaed;
      --muted: #8f98a6;
      --blue: #4aa3ff;
      --blue-bg: #19344c;
      --yellow: #f7b84b;
      --yellow-bg: #3b2c14;
      --danger: #ff6b6b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
      font-size: 14px;
    }

    button,
    select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #15191f;
      color: var(--text);
      cursor: pointer;
      padding: 7px 12px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 216px minmax(0, 1fr);
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: #111418;
      min-height: 100vh;
      padding: 14px 12px;
    }

    .brand {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .brand-sub {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.08em;
      margin-bottom: 20px;
    }

    .nav-section {
      border-top: 1px solid var(--line-soft);
      padding-top: 12px;
      margin-top: 12px;
    }

    .nav-label {
      color: #6f7785;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .nav-item {
      display: grid;
      grid-template-columns: 8px 1fr auto;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      color: #b8c0cc;
      font-weight: 700;
    }

    .nav-item[data-filter] {
      cursor: pointer;
    }

    .nav-item[data-view] {
      cursor: pointer;
    }

    .nav-dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: #555d68;
    }

    .nav-item.active {
      color: var(--blue);
    }

    .nav-item.active .nav-dot {
      background: var(--blue);
    }

    .nav-count {
      color: #8b94a1;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
    }

    .main {
      min-width: 0;
      background: var(--bg);
    }

    .topbar {
      height: 42px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: #14171b;
      padding: 0 24px;
    }

    .channel-select {
      min-width: 240px;
      border: 1px solid var(--line);
      background: #1a1f25;
      color: var(--text);
      border-radius: 4px;
      padding: 6px 10px;
      font-weight: 700;
    }

    .content {
      padding: 28px 30px 36px;
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      line-height: 1.2;
    }

    .summary {
      color: var(--muted);
      font-size: 13px;
    }

    .reload-button {
      min-width: 0;
    }

    .head-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .status {
      border: 1px solid var(--line);
      background: var(--panel);
      color: #bfc7d2;
      padding: 10px 12px;
      border-radius: 4px;
      margin-bottom: 14px;
      min-height: 40px;
    }

    .status.error {
      color: var(--danger);
      border-color: #59323a;
      background: #21171a;
    }

    .toolbar {
      min-height: 58px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 12px 14px;
      border-radius: 6px 6px 0 0;
    }

    .live-filter {
      min-width: 142px;
      border: 1px solid var(--line);
      background: #12161b;
      color: var(--text);
      border-radius: 4px;
      padding: 7px 10px;
      font-weight: 700;
    }

    .pager {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .page-info {
      min-width: 190px;
      color: #bfc7d2;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-top: 0;
      background: #15181d;
    }

    table {
      width: 100%;
      min-width: 1240px;
      border-collapse: collapse;
    }

    th,
    td {
      border-bottom: 1px solid var(--line-soft);
      padding: 10px 12px;
      vertical-align: middle;
    }

    th {
      color: #9aa3af;
      background: #15181d;
      font-size: 13px;
      text-align: left;
      white-space: nowrap;
    }

    th.highlight {
      color: var(--blue);
      background: #203246;
    }

    th.right,
    td.right {
      text-align: right;
    }

    tbody tr {
      background: #15181d;
    }

    tbody tr:hover {
      background: #191e25;
    }

    tbody tr.clickable-row {
      cursor: pointer;
    }

    .video-cell {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-width: 430px;
    }

    .thumb {
      width: 76px;
      height: 43px;
      object-fit: cover;
      display: block;
      border-radius: 3px;
      background: #303741;
    }

    .title {
      font-weight: 700;
      color: #f1f3f5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 520px;
    }

    .video-meta {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .date-cell,
    .number-cell {
      color: #d8dde5;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-live {
      color: #8fd0ff;
      background: var(--blue-bg);
      border: 1px solid #2c5d84;
    }

    .badge-public {
      color: var(--yellow);
      background: var(--yellow-bg);
      border: 1px solid #6f531e;
    }

    .empty {
      padding: 28px;
      text-align: center;
      color: var(--muted);
    }

    .view-hidden {
      display: none;
    }

    .bi-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .bi-tab {
      min-width: 118px;
      border-color: var(--line);
      background: #15191f;
    }

    .bi-tab.active {
      color: #d9ecff;
      border-color: #2f6f9f;
      background: #18324a;
    }

    .template-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .template-card {
      min-height: 92px;
      text-align: left;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 12px;
      border-radius: 6px;
    }

    .template-card.active {
      border-color: #2f6f9f;
      background: #182838;
    }

    .template-title {
      display: block;
      color: #eef3f8;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .template-meta {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .analysis-panel {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .control-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 12px;
      align-items: end;
    }

    .control-field {
      min-width: 0;
    }

    .control-label {
      display: block;
      color: #8f98a6;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .control-field select,
    .control-field input {
      width: 100%;
      border: 1px solid var(--line);
      background: #12161b;
      color: var(--text);
      border-radius: 4px;
      padding: 7px 10px;
      font: inherit;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 12px;
      color: #bfc7d2;
      font-size: 13px;
    }

    .toggle-row label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chart-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 14px;
    }

    .chart-panel {
      border: 1px solid var(--line);
      background: #11151a;
      border-radius: 6px;
      padding: 12px;
      min-width: 0;
    }

    .scatter-canvas {
      width: 100%;
      height: 430px;
      display: block;
      background: #0d1116;
      border: 1px solid var(--line-soft);
      border-radius: 4px;
    }

    .metric-stack {
      display: grid;
      gap: 10px;
    }

    .metric-card {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 6px;
      padding: 12px;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .metric-value {
      color: #f1f3f5;
      font-size: 24px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .insight-list {
      margin: 0;
      padding-left: 18px;
      color: #c7d0db;
      line-height: 1.55;
      font-size: 13px;
    }

    .outlier-table {
      width: 100%;
      min-width: 0;
      margin-top: 14px;
    }

    .outlier-table td,
    .outlier-table th {
      font-size: 12px;
      padding: 8px;
    }

    @media (max-width: 860px) {
      .shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .content {
        padding: 20px 14px;
      }

      .page-head,
      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .topbar {
        padding: 0 14px;
      }

      .channel-select {
        min-width: 0;
        width: 100%;
      }

      .template-grid,
      .control-grid,
      .chart-shell {
        grid-template-columns: 1fr;
      }
    }
  </style>
