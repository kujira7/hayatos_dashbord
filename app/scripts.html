  <script type="module">
    import * as duckdb from 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.29.0/+esm';

    const CSV_PATH = 'videos.csv';
    const CACHE_DB_NAME = 'hayato-live-dashboard';
    const CACHE_STORE_NAME = 'datasets';
    const CACHE_KEY = 'videos';
    const CACHE_SCHEMA_VERSION = 1;
    const $ = (selector) => document.querySelector(selector);
    const SORT_COLUMNS = {
      title: { expression: 'lower(title)', defaultDirection: 'asc' },
      published_at: { expression: "try_cast(published_at AS TIMESTAMP)", defaultDirection: 'desc' },
      video_type: {
        expression: `CASE
          WHEN COALESCE(live_type, '') LIKE '%LIVE%' THEN 'LIVE'
          WHEN COALESCE(try_cast(duration_sec AS BIGINT), 999999) <= 60 THEN 'Shorts'
          ELSE '通常動画'
        END`,
        defaultDirection: 'asc'
      },
      visibility: { expression: 'visibility', defaultDirection: 'asc' },
      view_count: { expression: 'try_cast(view_count AS DOUBLE)', defaultDirection: 'desc' },
      like_count: { expression: 'try_cast(like_count AS DOUBLE)', defaultDirection: 'desc' },
      comment_count: { expression: 'try_cast(comment_count AS DOUBLE)', defaultDirection: 'desc' },
      peak_concurrent_viewers: { expression: 'try_cast(peak_concurrent_viewers AS DOUBLE)', defaultDirection: 'desc' }
    };
    const BI_METRICS = {
      duration_sec_num: { label: '動画の長さ', format: formatDuration },
      view_count_num: { label: '閲覧数', format: formatNumber },
      like_count_num: { label: 'Like数', format: formatNumber },
      comment_count_num: { label: 'コメント数', format: formatNumber },
      published_hour_num: { label: '公開時刻', format: formatHour },
      peak_concurrent_viewers_num: { label: '最大同接(API)', format: formatNumber }
    };
    const CORRELATION_TEMPLATES = [
      {
        id: 'duration_views',
        title: '長い動画は伸びる？',
        meta: 'X: 動画の長さ / Y: 閲覧数',
        x: 'duration_sec_num',
        y: 'view_count_num',
        color: 'video_type',
        filter: 'category:all'
      },
      {
        id: 'like_views',
        title: 'Like数と伸びの関係',
        meta: 'X: Like数 / Y: 閲覧数',
        x: 'like_count_num',
        y: 'view_count_num',
        color: 'video_type',
        filter: 'category:all'
      },
      {
        id: 'comment_views',
        title: 'コメントが多い動画は伸びる？',
        meta: 'X: コメント数 / Y: 閲覧数',
        x: 'comment_count_num',
        y: 'view_count_num',
        color: 'video_type',
        filter: 'category:all'
      },
      {
        id: 'hour_views',
        title: '公開時間で差が出る？',
        meta: 'X: 公開時刻 / Y: 閲覧数',
        x: 'published_hour_num',
        y: 'view_count_num',
        color: 'video_type',
        filter: 'category:all'
      }
    ];
    const state = {
      db: null,
      conn: null,
      dataset: null,
      currentView: 'list',
      rowCount: 0,
      filteredCount: 0,
      categoryCounts: {
        normal: 0,
        shorts: 0,
        live: 0
      },
      currentPage: 1,
      totalPages: 1,
      pageSize: 50,
      filterValue: 'category:all',
      sortKey: 'peak_concurrent_viewers',
      sortDirection: 'desc',
      activeCorrelationTemplate: CORRELATION_TEMPLATES[0].id,
      publishedDateValues: [],
      durationRange: null,
      statusTimerId: null,
      correlationPoints: []
    };

    function setStatus(message, options = {}) {
      const { type = 'loading', autoHideMs = type === 'success' ? 2000 : 0 } = options;
      const status = $('#status');

      if (state.statusTimerId) {
        clearTimeout(state.statusTimerId);
        state.statusTimerId = null;
      }

      status.textContent = message;
      status.hidden = false;
      status.classList.toggle('error', type === 'error');

      if (autoHideMs > 0) {
        state.statusTimerId = setTimeout(() => {
          status.hidden = true;
          state.statusTimerId = null;
        }, autoHideMs);
      }
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[ch]));
    }

    function gasRun(functionName, ...args) {
      return new Promise((resolve, reject) => {
        window.google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)[functionName](...args);
      });
    }

    function openDatasetCache() {
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) {
          reject(new Error('IndexedDB is not available.'));
          return;
        }

        const request = indexedDB.open(CACHE_DB_NAME, 1);

        request.onupgradeneeded = () => {
          request.result.createObjectStore(CACHE_STORE_NAME, { keyPath: 'key' });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function withDatasetCache(mode, operation) {
      const db = await openDatasetCache();

      try {
        return await new Promise((resolve, reject) => {
          const transaction = db.transaction(CACHE_STORE_NAME, mode);
          const store = transaction.objectStore(CACHE_STORE_NAME);
          const request = operation(store);

          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      } finally {
        db.close();
      }
    }

    async function readCachedDataset() {
      try {
        const record = await withDatasetCache('readonly', (store) => store.get(CACHE_KEY));

        if (!record || record.cacheSchemaVersion !== CACHE_SCHEMA_VERSION || !record.csv) {
          return null;
        }

        return record;
      } catch (error) {
        console.warn('Dataset cache read failed.', error);
        return null;
      }
    }

    async function writeCachedDataset(dataset) {
      try {
        await withDatasetCache('readwrite', (store) => store.put({
          key: CACHE_KEY,
          cacheSchemaVersion: CACHE_SCHEMA_VERSION,
          csvFile: dataset.csvFile,
          metadata: dataset.metadata,
          rowCountIncludingHeader: dataset.rowCountIncludingHeader,
          dataRowCount: dataset.dataRowCount,
          columnCount: dataset.columnCount,
          csvBytes: dataset.csvBytes,
          csv: dataset.csv,
          cachedAt: new Date().toISOString()
        }));
      } catch (error) {
        console.warn('Dataset cache write failed.', error);
      }
    }

    async function clearCachedDataset() {
      try {
        await withDatasetCache('readwrite', (store) => store.delete(CACHE_KEY));
      } catch (error) {
        console.warn('Dataset cache clear failed.', error);
      }
    }

    function cachedRecordToDataset(record) {
      return {
        csvFile: record.csvFile,
        metadata: record.metadata,
        rowCountIncludingHeader: record.rowCountIncludingHeader,
        dataRowCount: record.dataRowCount,
        columnCount: record.columnCount,
        csvBytes: record.csvBytes,
        csv: record.csv,
        cache: {
          cachedAt: record.cachedAt
        }
      };
    }

    function isCachedDatasetFresh(cacheRecord, manifest) {
      return Boolean(
        cacheRecord &&
        manifest &&
        cacheRecord.csvFile?.id === manifest.csvFile?.id &&
        cacheRecord.csvFile?.lastUpdated === manifest.csvFile?.lastUpdated &&
        Number(cacheRecord.csvBytes) === Number(manifest.csvBytes)
      );
    }

    function formatMs(value) {
      if (!Number.isFinite(value)) {
        return '-';
      }

      return `${Math.round(value).toLocaleString('ja-JP')}ms`;
    }

    async function measureTiming(timings, label, operation) {
      const start = performance.now();

      try {
        return await operation();
      } finally {
        timings[label] = performance.now() - start;
      }
    }

    function logLoadTimings(timings, dataset) {
      const payload = {
        client: Object.fromEntries(
          Object.entries(timings).map(([key, value]) => [key, Math.round(value)])
        ),
        server: dataset?.serverTimingsMs || {},
        csvBytes: dataset?.csvBytes,
        dataRowCount: dataset?.dataRowCount
      };

      console.info('Initial load timings', payload);
    }

    function formatLoadTimingStatus(timings, dataset) {
      const gasTotal = timings.getDatasetCsv ?? timings.getDatasetManifest;
      const serverTotal = dataset?.serverTimingsMs?.total;

      return [
        `total ${formatMs(timings.total)}`,
        `GAS ${formatMs(gasTotal)}`,
        `server ${formatMs(serverTotal)}`,
        `DuckDB ${formatMs(timings.createDuckDB)}`
      ].join(' / ');
    }

    async function createDuckDB() {
      const bundles = duckdb.getJsDelivrBundles();
      const bundle = await duckdb.selectBundle(bundles);
      const workerUrl = URL.createObjectURL(
        new Blob(
          [`importScripts("${bundle.mainWorker}");`],
          { type: 'text/javascript' }
        )
      );
      const worker = new Worker(workerUrl);
      const logger = new duckdb.ConsoleLogger();
      const db = new duckdb.AsyncDuckDB(logger, worker);

      await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
      URL.revokeObjectURL(workerUrl);

      return db;
    }

    function arrowRows(result) {
      return result.toArray().map((row) => row.toJSON());
    }

    function sqlString(value) {
      return String(value).replace(/'/g, "''");
    }

    function getWhereSql() {
      if (state.filterValue === 'category:all') {
        return '';
      }

      if (state.filterValue === 'category:normal') {
        return `
          WHERE COALESCE(live_type, '') NOT LIKE '%LIVE%'
            AND COALESCE(try_cast(duration_sec AS BIGINT), 999999) > 60
        `;
      }

      if (state.filterValue === 'category:shorts') {
        return `
          WHERE COALESCE(live_type, '') NOT LIKE '%LIVE%'
            AND COALESCE(try_cast(duration_sec AS BIGINT), 999999) <= 60
        `;
      }

      return "WHERE COALESCE(live_type, '') LIKE '%LIVE%'";
    }

    function getOrderBySql() {
      const sortColumn = SORT_COLUMNS[state.sortKey] || SORT_COLUMNS.peak_concurrent_viewers;
      const direction = state.sortDirection === 'asc' ? 'ASC' : 'DESC';
      const fallback = state.sortKey === 'published_at'
        ? 'video_id ASC'
        : "try_cast(published_at AS TIMESTAMP) DESC NULLS LAST, video_id ASC";

      return `ORDER BY ${sortColumn.expression} ${direction} NULLS LAST, ${fallback}`;
    }

    function getFilterLabel() {
      if (state.filterValue === 'category:all') return 'ALL';
      if (state.filterValue === 'category:normal') return '通常動画';
      if (state.filterValue === 'category:shorts') return 'Shorts';
      return 'LIVE';
    }

    function formatNumber(value) {
      if (value === null || value === undefined || value === '') return '-';
      return Number(value).toLocaleString('ja-JP');
    }

    function formatDecimal(value) {
      if (value === null || value === undefined || value === '') return '-';
      const number = Number(value);
      if (!Number.isFinite(number)) return '-';
      return number.toLocaleString('ja-JP', { maximumFractionDigits: 1 });
    }

    function formatHour(value) {
      if (value === null || value === undefined || value === '') return '-';
      const hour = Number(value);
      if (!Number.isFinite(hour)) return '-';
      return `${String(hour).padStart(2, '0')}:00`;
    }

    function formatDate(value) {
      if (!value) return '-';
      const date = value instanceof Date ? value : new Date(value);
      if (Number.isNaN(date.getTime())) return String(value).slice(0, 10);

      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function formatDateTime(value) {
      if (!value) return '不明';
      const date = value instanceof Date ? value : new Date(value);

      if (Number.isNaN(date.getTime())) {
        return '不明';
      }

      const parts = Object.fromEntries(
        new Intl.DateTimeFormat('ja-JP', {
          timeZone: 'Asia/Tokyo',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          hour12: false,
          hourCycle: 'h23'
        }).formatToParts(date).map((part) => [part.type, part.value])
      );

      return `${parts.year}/${parts.month}/${parts.day} ${parts.hour}:${parts.minute}`;
    }

    function getYoutubeFinishedAt() {
      const metadata = state.dataset?.metadata || {};

      if (metadata.last_success_finished_at) {
        return metadata.last_success_finished_at;
      }

      if (metadata.last_refresh_status === 'success') {
        return metadata.last_refresh_finished_at;
      }

      return '';
    }

    function formatYoutubeFinishedAtSummary() {
      return `YouTubeからのデータ取得日時 ${formatDateTime(getYoutubeFinishedAt())}`;
    }

    function formatDuration(value) {
      const total = Number(value);
      if (!Number.isFinite(total) || total <= 0) return '-';

      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const seconds = Math.floor(total % 60);

      if (hours > 0) {
        return `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }

      return `${minutes}:${String(seconds).padStart(2, '0')}`;
    }

    function parseDurationInput(value) {
      const text = String(value || '').trim();
      if (!text || text === '-') return null;

      if (/^\d+(\.\d+)?$/.test(text)) {
        return Number(text);
      }

      const parts = text.split(':').map((part) => part.trim());
      if (parts.length < 2 || parts.length > 3 || parts.some((part) => !/^\d+$/.test(part))) {
        return null;
      }

      const numbers = parts.map(Number);
      if (numbers.some((number) => !Number.isFinite(number))) return null;

      if (numbers.length === 2) {
        return (numbers[0] * 60) + numbers[1];
      }

      return (numbers[0] * 3600) + (numbers[1] * 60) + numbers[2];
    }

    function parsePublishedDateInput(value) {
      const text = String(value || '').trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(text)) return null;

      const date = new Date(`${text}T00:00:00`);
      if (Number.isNaN(date.getTime())) return null;

      return text;
    }

    function normalizeVisibility(value) {
      if (value === 'public') return '公開';
      if (value === 'unlisted') return '限定公開';
      if (value === 'private') return '非公開';
      return value || '-';
    }

    function normalizeVideoType(value, durationSec) {
      if (String(value || '').includes('LIVE')) return 'LIVE';

      const duration = Number(durationSec);
      if (Number.isFinite(duration) && duration <= 60) return 'Shorts';

      return value || '通常動画';
    }

    function renderRows(rows) {
      if (rows.length === 0) {
        $('#tbody').innerHTML = '<tr><td class="empty" colspan="8">表示できる動画がありません。</td></tr>';
        return;
      }

      $('#tbody').innerHTML = rows.map((row) => {
        const videoUrl = escapeHtml(row.video_id ? `https://www.youtube.com/watch?v=${row.video_id}` : '');
        const thumb = escapeHtml(row.thumbnail_url);
        const title = escapeHtml(row.title);
        const published = escapeHtml(formatDate(row.published_at));
        const duration = escapeHtml(formatDuration(row.duration_sec));
        const liveType = escapeHtml(normalizeVideoType(row.live_type, row.duration_sec));
        const visibility = escapeHtml(normalizeVisibility(row.visibility));
        const views = escapeHtml(formatNumber(row.view_count));
        const likes = escapeHtml(formatNumber(row.like_count));
        const comments = escapeHtml(formatNumber(row.comment_count));
        const peak = escapeHtml(formatNumber(row.peak_concurrent_viewers));

        return `
          <tr class="clickable-row" data-video-url="${videoUrl}" tabindex="0">
            <td>
              <div class="video-cell">
                <img
                  class="thumb"
                  src="${thumb}"
                  loading="lazy"
                  decoding="async"
                  width="76"
                  height="43"
                  onerror="this.style.display='none'"
                >
                <div>
                  <div class="title" title="${title}">${title}</div>
                  <div class="video-meta">- ${duration} ・ ${liveType}</div>
                </div>
              </div>
            </td>
            <td class="date-cell">${published}</td>
            <td><span class="badge badge-live">${liveType}</span></td>
            <td><span class="badge badge-public">${visibility}</span></td>
            <td class="number-cell right">${views}</td>
            <td class="number-cell right">${likes}</td>
            <td class="number-cell right">${comments}</td>
            <td class="number-cell right">${peak}</td>
          </tr>
        `;
      }).join('');
    }

    function renderCounts() {
      const filtered = state.filteredCount.toLocaleString('ja-JP');
      const filterLabel = getFilterLabel();

      $('#side-normal-count').textContent = state.categoryCounts.normal.toLocaleString('ja-JP');
      $('#side-shorts-count').textContent = state.categoryCounts.shorts.toLocaleString('ja-JP');
      $('#side-live-count').textContent = state.categoryCounts.live.toLocaleString('ja-JP');
      document.querySelectorAll('.nav-item[data-filter]').forEach((item) => {
        item.classList.toggle('active', item.dataset.filter === state.filterValue);
      });
      $('#page-title').textContent = filterLabel;
      $('#summary').textContent = `全期間 | ${filterLabel} | 全 ${filtered} 本 | ${formatYoutubeFinishedAtSummary()}`;
    }

    function renderPager() {
      const start = state.filteredCount === 0
        ? 0
        : ((state.currentPage - 1) * state.pageSize) + 1;
      const end = Math.min(state.currentPage * state.pageSize, state.filteredCount);
      const pageText = state.filteredCount === 0
        ? '0件'
        : `${start.toLocaleString('ja-JP')}-${end.toLocaleString('ja-JP')} / ${state.filteredCount.toLocaleString('ja-JP')}件`;

      document.querySelectorAll('.page-info').forEach((element) => {
        element.textContent = pageText;
      });
      document.querySelectorAll('[data-page-action="prev"]').forEach((button) => {
        button.disabled = state.currentPage <= 1;
      });
      document.querySelectorAll('[data-page-action="next"]').forEach((button) => {
        button.disabled = state.currentPage >= state.totalPages;
      });
    }

    function renderSortHeaders() {
      document.querySelectorAll('th[data-sort-key]').forEach((header) => {
        const active = header.dataset.sortKey === state.sortKey;
        header.classList.toggle('active-sort', active);
        header.dataset.sortDirection = active ? state.sortDirection : '';
      });
    }

    function setPagerButtonsDisabled(disabled) {
      document.querySelectorAll('[data-page-action]').forEach((button) => {
        button.disabled = disabled;
      });
    }

    async function refreshFilterOptions() {
      $('#live-filter').innerHTML = [
        `<option value="category:all">ALL (${state.rowCount.toLocaleString('ja-JP')})</option>`,
        `<option value="category:live">LIVE (${state.categoryCounts.live.toLocaleString('ja-JP')})</option>`,
        `<option value="category:normal">通常動画 (${state.categoryCounts.normal.toLocaleString('ja-JP')})</option>`,
        `<option value="category:shorts">Shorts (${state.categoryCounts.shorts.toLocaleString('ja-JP')})</option>`
      ].join('');
    }

    async function refreshCategoryCounts() {
      const rows = arrowRows(await state.conn.query(`
        SELECT
          count(*)::VARCHAR AS total_count,
          sum(CASE
            WHEN COALESCE(live_type, '') LIKE '%LIVE%' THEN 1
            ELSE 0
          END)::VARCHAR AS live_count,
          sum(CASE
            WHEN COALESCE(live_type, '') NOT LIKE '%LIVE%'
              AND COALESCE(try_cast(duration_sec AS BIGINT), 999999) <= 60 THEN 1
            ELSE 0
          END)::VARCHAR AS shorts_count,
          sum(CASE
            WHEN COALESCE(live_type, '') NOT LIKE '%LIVE%'
              AND COALESCE(try_cast(duration_sec AS BIGINT), 999999) > 60 THEN 1
            ELSE 0
          END)::VARCHAR AS normal_count
        FROM videos
      `));
      const row = rows[0] || {};

      state.rowCount = Number(row.total_count || 0);
      state.categoryCounts = {
        normal: Number(row.normal_count || 0),
        shorts: Number(row.shorts_count || 0),
        live: Number(row.live_count || 0)
      };
    }

    async function refreshCounts() {
      await refreshCategoryCounts();
      const filteredRows = arrowRows(await state.conn.query(`
        SELECT count(*)::VARCHAR AS row_count
        FROM videos
        ${getWhereSql()}
      `));

      state.filteredCount = Number(filteredRows[0].row_count);
      state.totalPages = Math.max(1, Math.ceil(state.filteredCount / state.pageSize));
      state.currentPage = Math.min(state.currentPage, state.totalPages);
      renderCounts();
      renderPager();
      renderSortHeaders();
    }

    async function renderPage(page) {
      state.currentPage = Math.max(1, Math.min(page, state.totalPages));
      const offset = (state.currentPage - 1) * state.pageSize;

      const rows = arrowRows(await state.conn.query(`
        SELECT
          thumbnail_url,
          video_id,
          title,
          published_at,
          duration_sec,
          live_type,
          visibility,
          view_count,
          like_count,
          comment_count,
          peak_concurrent_viewers
        FROM videos
        ${getWhereSql()}
        ${getOrderBySql()}
        LIMIT ${state.pageSize}
        OFFSET ${offset}
      `));

      renderRows(rows);
      renderPager();
    }

    async function createBiView() {
      await state.conn.query(`
        CREATE OR REPLACE VIEW videos_bi AS
        WITH base AS (
          SELECT
            *,
            try_cast(view_count AS DOUBLE) AS view_count_num,
            try_cast(like_count AS DOUBLE) AS like_count_num,
            try_cast(comment_count AS DOUBLE) AS comment_count_num,
            try_cast(duration_sec AS DOUBLE) AS duration_sec_num,
            try_cast(peak_concurrent_viewers AS DOUBLE) AS peak_concurrent_viewers_num,
            cast(published_at AS VARCHAR) AS published_at_text,
            try_cast(substr(cast(published_at AS VARCHAR), 1, 10) AS DATE) AS published_date,
            try_cast(substr(cast(published_at AS VARCHAR), 12, 2) AS INTEGER) AS published_hour_num
          FROM videos
        ),
        enriched AS (
          SELECT
            *,
            CASE
              WHEN COALESCE(live_type, '') LIKE '%LIVE%' THEN 'LIVE'
              WHEN COALESCE(duration_sec_num, 999999) <= 60 THEN 'Shorts'
              ELSE '通常動画'
            END AS video_type,
            CASE
              WHEN COALESCE(live_type, '') LIKE '%LIVE%' AND COALESCE(duration_sec_num, 0) < 3600 THEN 'LIVE 1h未満'
              WHEN COALESCE(live_type, '') LIKE '%LIVE%' AND COALESCE(duration_sec_num, 0) < 7200 THEN 'LIVE 1-2h'
              WHEN COALESCE(live_type, '') LIKE '%LIVE%' AND COALESCE(duration_sec_num, 0) < 14400 THEN 'LIVE 2-4h'
              WHEN COALESCE(live_type, '') LIKE '%LIVE%' THEN 'LIVE 4h+'
              WHEN COALESCE(duration_sec_num, 999999) <= 60 THEN 'Shorts'
              WHEN COALESCE(duration_sec_num, 0) < 600 THEN '通常 0-10m'
              WHEN COALESCE(duration_sec_num, 0) < 1200 THEN '通常 10-20m'
              WHEN COALESCE(duration_sec_num, 0) < 2400 THEN '通常 20-40m'
              ELSE '通常 40m+'
            END AS duration_bucket,
            substr(published_at_text, 1, 7) AS published_month,
            substr(published_at_text, 1, 4) AS published_year
          FROM base
        )
        SELECT
          *
        FROM enriched
      `);
    }

    function initializeBiControls() {
      const metricOptions = Object.entries(BI_METRICS)
        .map(([value, metric]) => `<option value="${value}">${escapeHtml(metric.label)}</option>`)
        .join('');

      $('#x-metric').innerHTML = metricOptions;
      $('#y-metric').innerHTML = metricOptions;
      applyCorrelationTemplate(CORRELATION_TEMPLATES[0], false);
      renderCorrelationTemplates();
    }

    async function refreshBiFilterOptions() {
      const durationRows = arrowRows(await state.conn.query(`
        SELECT
          floor(min(duration_sec_num))::VARCHAR AS min_duration,
          ceil(max(duration_sec_num))::VARCHAR AS max_duration
        FROM videos_bi
        WHERE duration_sec_num IS NOT NULL
      `));
      const dateRows = arrowRows(await state.conn.query(`
        SELECT cast(published_date AS VARCHAR) AS published_date_text
        FROM videos_bi
        WHERE published_date IS NOT NULL
        GROUP BY published_date
        ORDER BY published_date
      `));
      const yearRows = arrowRows(await state.conn.query(`
        SELECT published_year, count(*)::VARCHAR AS count
        FROM videos_bi
        WHERE published_year IS NOT NULL
        GROUP BY published_year
        ORDER BY published_year DESC
      `));
      const hourRows = arrowRows(await state.conn.query(`
        SELECT published_hour_num, count(*)::VARCHAR AS count
        FROM videos_bi
        WHERE published_hour_num IS NOT NULL
        GROUP BY published_hour_num
        ORDER BY published_hour_num
      `));

      state.publishedDateValues = dateRows.map((row) => row.published_date_text).filter(Boolean);
      state.durationRange = durationRows.length === 0
        ? null
        : {
          min: Number(durationRows[0].min_duration || 0),
          max: Number(durationRows[0].max_duration || 0)
        };

      resetDurationFilter();
      resetPublishedDateFilter();

      $('#published-year-filter').innerHTML = [
        '<option value="">ALL</option>',
        ...yearRows.map((row) => {
          const value = escapeHtml(row.published_year || '');
          const label = `${row.published_year || '-'} (${Number(row.count).toLocaleString('ja-JP')})`;
          return `<option value="${value}">${escapeHtml(label)}</option>`;
        })
      ].join('');
      $('#published-hour-filter').innerHTML = [
        '<option value="">ALL</option>',
        ...hourRows.map((row) => {
          const value = escapeHtml(row.published_hour_num ?? '');
          const label = `${formatHour(row.published_hour_num)} (${Number(row.count).toLocaleString('ja-JP')})`;
          return `<option value="${value}">${escapeHtml(label)}</option>`;
        })
      ].join('');
    }

    function resetDurationFilter() {
      const start = $('#duration-start');
      const end = $('#duration-end');

      if (!state.durationRange || state.durationRange.max <= state.durationRange.min) {
        start.disabled = true;
        end.disabled = true;
        $('#duration-start-label').value = '-';
        $('#duration-end-label').value = '-';
        updateRangeFill('duration', 0, 0, 0, 0);
        return;
      }

      [start, end].forEach((slider) => {
        slider.min = String(state.durationRange.min);
        slider.max = String(state.durationRange.max);
        slider.step = '60';
        slider.disabled = false;
      });
      start.value = String(state.durationRange.min);
      end.value = String(state.durationRange.max);
      updateDurationSliderLabels();
    }

    function getDurationRange() {
      if (!state.durationRange || state.durationRange.max <= state.durationRange.min) return null;

      const start = Math.min(Number($('#duration-start').value), Number($('#duration-end').value));
      const end = Math.max(Number($('#duration-start').value), Number($('#duration-end').value));
      return { start, end };
    }

    function updateDurationSliderLabels() {
      const range = getDurationRange();

      if (!range) {
        $('#duration-start-label').value = '-';
        $('#duration-end-label').value = '-';
        updateRangeFill('duration', 0, 0, 0, 0);
        return;
      }

      $('#duration-start-label').value = formatDuration(range.start);
      $('#duration-end-label').value = formatDuration(range.end);
      updateRangeFill('duration', state.durationRange.min, state.durationRange.max, range.start, range.end);
    }

    function resetPublishedDateFilter() {
      const start = $('#published-date-start');
      const end = $('#published-date-end');
      const maxIndex = state.publishedDateValues.length - 1;

      if (maxIndex <= 0) {
        start.disabled = true;
        end.disabled = true;
        $('#published-date-start-label').value = state.publishedDateValues[0] || '-';
        $('#published-date-end-label').value = state.publishedDateValues[0] || '-';
        updateRangeFill('published-date', 0, 0, 0, 0);
        return;
      }

      [start, end].forEach((slider) => {
        slider.min = '0';
        slider.max = String(maxIndex);
        slider.step = '1';
        slider.disabled = false;
      });
      start.value = '0';
      end.value = String(maxIndex);
      updatePublishedDateSliderLabels();
    }

    function getPublishedDateRange() {
      if (state.publishedDateValues.length === 0) return null;

      const startIndex = Math.min(Number($('#published-date-start').value), Number($('#published-date-end').value));
      const endIndex = Math.max(Number($('#published-date-start').value), Number($('#published-date-end').value));
      return {
        start: state.publishedDateValues[startIndex],
        end: state.publishedDateValues[endIndex]
      };
    }

    function updatePublishedDateSliderLabels() {
      const range = getPublishedDateRange();
      const startIndex = Math.min(Number($('#published-date-start').value), Number($('#published-date-end').value));
      const endIndex = Math.max(Number($('#published-date-start').value), Number($('#published-date-end').value));
      const maxIndex = Math.max(0, state.publishedDateValues.length - 1);

      $('#published-date-start-label').value = range?.start || '-';
      $('#published-date-end-label').value = range?.end || '-';
      updateRangeFill('published-date', 0, maxIndex, startIndex, endIndex);
    }

    function setDurationFromInput(targetId) {
      if (!state.durationRange || state.durationRange.max <= state.durationRange.min) return;

      const input = $(`#${targetId}-label`);
      const slider = $(`#${targetId}`);
      const parsed = parseDurationInput(input.value);

      if (parsed === null) {
        updateDurationSliderLabels();
        return;
      }

      const value = Math.max(state.durationRange.min, Math.min(state.durationRange.max, parsed));
      slider.value = String(value);
      updateDurationSliderLabels();
      renderCorrelation().catch(handleError);
    }

    function findNearestPublishedDateIndex(dateText) {
      if (state.publishedDateValues.length === 0) return -1;

      let bestIndex = 0;
      let bestDistance = Infinity;
      const targetTime = new Date(`${dateText}T00:00:00`).getTime();

      state.publishedDateValues.forEach((candidate, index) => {
        const distance = Math.abs(new Date(`${candidate}T00:00:00`).getTime() - targetTime);
        if (distance < bestDistance) {
          bestDistance = distance;
          bestIndex = index;
        }
      });

      return bestIndex;
    }

    function setPublishedDateFromInput(targetId) {
      const input = $(`#${targetId}-label`);
      const slider = $(`#${targetId}`);
      const parsed = parsePublishedDateInput(input.value);

      if (parsed === null) {
        updatePublishedDateSliderLabels();
        return;
      }

      const index = findNearestPublishedDateIndex(parsed);
      if (index < 0) {
        updatePublishedDateSliderLabels();
        return;
      }

      slider.value = String(index);
      updatePublishedDateSliderLabels();
      renderCorrelation().catch(handleError);
    }

    function updateRangeFill(prefix, min, max, start, end) {
      const fill = $(`#${prefix}-range-fill`);
      const span = max - min;

      if (!fill || span <= 0) {
        if (fill) {
          fill.style.left = '0%';
          fill.style.right = '0%';
        }
        return;
      }

      const left = ((start - min) / span) * 100;
      const right = 100 - (((end - min) / span) * 100);
      fill.style.left = `${Math.max(0, Math.min(100, left))}%`;
      fill.style.right = `${Math.max(0, Math.min(100, right))}%`;
    }

    function renderCorrelationTemplates() {
      $('#correlation-templates').innerHTML = CORRELATION_TEMPLATES.map((template) => `
        <button
          class="template-card ${template.id === state.activeCorrelationTemplate ? 'active' : ''}"
          type="button"
          data-template-id="${escapeHtml(template.id)}"
        >
          <span class="template-title">${escapeHtml(template.title)}</span>
          <span class="template-meta">${escapeHtml(template.meta)}</span>
        </button>
      `).join('');
    }

    function applyCorrelationTemplate(template, shouldRender = true) {
      state.activeCorrelationTemplate = template.id;
      $('#x-metric').value = template.x;
      $('#y-metric').value = template.y;
      $('#color-metric').value = template.color;
      $('#bi-filter').value = template.filter;
      renderCorrelationTemplates();

      if (shouldRender && state.conn) {
        renderCorrelation().catch(handleError);
      }
    }

    function getBiWhereSql(xMetric, yMetric) {
      const conditions = [
        `${xMetric} IS NOT NULL`,
        `${yMetric} IS NOT NULL`
      ];
      const filterValue = $('#bi-filter').value;
      const durationRange = getDurationRange();
      const publishedDateRange = getPublishedDateRange();
      const publishedYear = $('#published-year-filter').value;
      const publishedHour = $('#published-hour-filter').value;
      const keyword = $('#bi-keyword').value.trim();

      if (filterValue === 'category:live') {
        conditions.push("video_type = 'LIVE'");
      } else if (filterValue === 'category:normal') {
        conditions.push("video_type = '通常動画'");
      } else if (filterValue === 'category:shorts') {
        conditions.push("video_type = 'Shorts'");
      }

      if (keyword) {
        conditions.push(`title ILIKE '%${sqlString(keyword)}%'`);
      }

      if (durationRange) {
        conditions.push(`duration_sec_num BETWEEN ${durationRange.start} AND ${durationRange.end}`);
      }

      if (publishedDateRange) {
        conditions.push(`published_date BETWEEN DATE '${sqlString(publishedDateRange.start)}' AND DATE '${sqlString(publishedDateRange.end)}'`);
      }

      if (publishedYear) {
        conditions.push(`published_year = '${sqlString(publishedYear)}'`);
      }

      if (publishedHour) {
        conditions.push(`published_hour_num = ${Number(publishedHour)}`);
      }

      return `WHERE ${conditions.join(' AND ')}`;
    }

    function getMetricValue(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) return null;

      return number;
    }

    function calculatePearson(points) {
      if (points.length < 2) return null;

      const meanX = points.reduce((sum, point) => sum + point.xPlot, 0) / points.length;
      const meanY = points.reduce((sum, point) => sum + point.yPlot, 0) / points.length;
      let numerator = 0;
      let sumX = 0;
      let sumY = 0;

      points.forEach((point) => {
        const dx = point.xPlot - meanX;
        const dy = point.yPlot - meanY;
        numerator += dx * dy;
        sumX += dx * dx;
        sumY += dy * dy;
      });

      const denominator = Math.sqrt(sumX * sumY);
      return denominator === 0 ? null : numerator / denominator;
    }

    function formatAxisTick(value, metric) {
      if (metric === 'duration_sec_num') return formatDuration(value);
      if (metric === 'published_hour_num') return formatHour(value);

      return formatCompactNumber(value);
    }

    function formatCompactNumber(value) {
      const number = Number(value);

      if (!Number.isFinite(number)) return '-';
      if (Math.abs(number) >= 1000000) return `${(number / 1000000).toLocaleString('ja-JP', { maximumFractionDigits: 1 })}M`;
      if (Math.abs(number) >= 1000) return `${(number / 1000).toLocaleString('ja-JP', { maximumFractionDigits: 1 })}K`;
      if (Math.abs(number) >= 10) return number.toLocaleString('ja-JP', { maximumFractionDigits: 0 });
      return number.toLocaleString('ja-JP', { maximumFractionDigits: 2 });
    }

    function drawAxisTicks(ctx, minX, maxX, minY, maxY, xToCanvas, yToCanvas, padding, plotWidth, plotHeight, xMetric, yMetric) {
      const tickCount = 5;

      ctx.font = '11px Arial';
      ctx.strokeStyle = '#22272e';
      ctx.fillStyle = '#8f98a6';
      ctx.lineWidth = 1;

      for (let index = 0; index < tickCount; index += 1) {
        const ratio = tickCount === 1 ? 0 : index / (tickCount - 1);
        const xValue = minX + ((maxX - minX) * ratio);
        const x = xToCanvas(xValue);

        ctx.beginPath();
        ctx.moveTo(x, padding.top);
        ctx.lineTo(x, padding.top + plotHeight);
        ctx.stroke();

        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(formatAxisTick(xValue, xMetric), x, padding.top + plotHeight + 8);

        const yValue = minY + ((maxY - minY) * ratio);
        const y = yToCanvas(yValue);

        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(padding.left + plotWidth, y);
        ctx.stroke();

        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(formatAxisTick(yValue, yMetric), padding.left - 8, y);
      }
    }

    function createPlotContext(points, xMetric, yMetric) {
      const canvas = $('#correlation-canvas');
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const padding = { top: 24, right: 28, bottom: 52, left: 72 };
      const plotWidth = width - padding.left - padding.right;
      const plotHeight = height - padding.top - padding.bottom;

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#0d1116';
      ctx.fillRect(0, 0, width, height);

      if (points.length === 0) {
        ctx.fillStyle = '#8f98a6';
        ctx.font = '14px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('表示できる点がありません。', width / 2, height / 2);
        state.correlationPoints = [];
        return null;
      }

      const xs = points.map((point) => point.xPlot);
      const ys = points.map((point) => point.yPlot);
      let minX = Math.min(...xs);
      let maxX = Math.max(...xs);
      let minY = Math.min(...ys);
      let maxY = Math.max(...ys);

      if (minX === maxX) {
        minX -= 1;
        maxX += 1;
      }

      if (minY === maxY) {
        minY -= 1;
        maxY += 1;
      }

      const xToCanvas = (value) => padding.left + ((value - minX) / (maxX - minX)) * plotWidth;
      const yToCanvas = (value) => padding.top + plotHeight - ((value - minY) / (maxY - minY)) * plotHeight;

      drawAxisTicks(ctx, minX, maxX, minY, maxY, xToCanvas, yToCanvas, padding, plotWidth, plotHeight, xMetric, yMetric);

      ctx.strokeStyle = '#2b3038';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padding.left, padding.top);
      ctx.lineTo(padding.left, padding.top + plotHeight);
      ctx.lineTo(padding.left + plotWidth, padding.top + plotHeight);
      ctx.stroke();

      ctx.fillStyle = '#9aa3af';
      ctx.font = '12px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(BI_METRICS[xMetric].label, padding.left + plotWidth / 2, height - 14);
      ctx.save();
      ctx.translate(16, padding.top + plotHeight / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText(BI_METRICS[yMetric].label, 0, 0);
      ctx.restore();

      return {
        ctx,
        padding,
        plotWidth,
        plotHeight,
        minX,
        maxX,
        minY,
        maxY,
        xToCanvas,
        yToCanvas
      };
    }

    function drawScatter(points, xMetric, yMetric) {
      const plot = createPlotContext(points, xMetric, yMetric);
      const palette = ['#4aa3ff', '#f7b84b', '#7bd88f', '#e078d8', '#ff7a7a', '#9d8cff'];
      const colorMap = {};

      if (!plot) return;

      state.correlationPoints = points.map((point) => {
        const key = String(point.colorValue || '-');

        if (!(key in colorMap)) {
          colorMap[key] = palette[Object.keys(colorMap).length % palette.length];
        }

        const cx = plot.xToCanvas(point.xPlot);
        const cy = plot.yToCanvas(point.yPlot);

        plot.ctx.beginPath();
        plot.ctx.fillStyle = colorMap[key];
        plot.ctx.globalAlpha = 0.5;
        plot.ctx.arc(cx, cy, 4, 0, Math.PI * 2);
        plot.ctx.fill();
        plot.ctx.globalAlpha = 1;

        return { ...point, hitType: 'point', cx, cy };
      });

      const legendEntries = Object.entries(colorMap).slice(0, 6);
      legendEntries.forEach(([label, color], index) => {
        const x = plot.padding.left + 8;
        const y = plot.padding.top + 16 + (index * 18);
        plot.ctx.fillStyle = color;
        plot.ctx.fillRect(x, y - 8, 10, 10);
        plot.ctx.fillStyle = '#c7d0db';
        plot.ctx.textAlign = 'left';
        plot.ctx.fillText(label, x + 16, y);
      });
    }

    function drawDensity(points, xMetric, yMetric) {
      const plot = createPlotContext(points, xMetric, yMetric);
      if (!plot) return;

      const xBins = 42;
      const yBins = 28;
      const bins = new Map();

      points.forEach((point) => {
        const xIndex = Math.min(xBins - 1, Math.max(0, Math.floor(((point.xPlot - plot.minX) / (plot.maxX - plot.minX)) * xBins)));
        const yIndex = Math.min(yBins - 1, Math.max(0, Math.floor(((point.yPlot - plot.minY) / (plot.maxY - plot.minY)) * yBins)));
        const key = `${xIndex}:${yIndex}`;

        if (!bins.has(key)) {
          bins.set(key, {
            hitType: 'bin',
            xIndex,
            yIndex,
            count: 0,
            examples: []
          });
        }

        const bin = bins.get(key);
        bin.count += 1;
        if (bin.examples.length < 4) {
          bin.examples.push(point);
        }
      });

      const maxCount = Math.max(1, ...Array.from(bins.values()).map((bin) => bin.count));
      const cellWidth = plot.plotWidth / xBins;
      const cellHeight = plot.plotHeight / yBins;

      state.correlationPoints = Array.from(bins.values()).map((bin) => {
        const left = plot.padding.left + (bin.xIndex * cellWidth);
        const top = plot.padding.top + ((yBins - 1 - bin.yIndex) * cellHeight);
        const intensity = Math.log1p(bin.count) / Math.log1p(maxCount);
        const alpha = 0.2 + (intensity * 0.72);
        const xMin = plot.minX + ((bin.xIndex / xBins) * (plot.maxX - plot.minX));
        const xMax = plot.minX + (((bin.xIndex + 1) / xBins) * (plot.maxX - plot.minX));
        const yMin = plot.minY + ((bin.yIndex / yBins) * (plot.maxY - plot.minY));
        const yMax = plot.minY + (((bin.yIndex + 1) / yBins) * (plot.maxY - plot.minY));

        plot.ctx.fillStyle = `rgba(74, 163, 255, ${alpha})`;
        plot.ctx.fillRect(left + 1, top + 1, Math.max(1, cellWidth - 2), Math.max(1, cellHeight - 2));

        return {
          ...bin,
          left,
          top,
          width: cellWidth,
          height: cellHeight,
          xMin,
          xMax,
          yMin,
          yMax
        };
      });

      plot.ctx.fillStyle = '#c7d0db';
      plot.ctx.font = '11px Arial';
      plot.ctx.textAlign = 'left';
      plot.ctx.fillText(`密度: 1セル最大 ${maxCount.toLocaleString('ja-JP')} 本`, plot.padding.left + 8, plot.padding.top + 16);
    }

    function renderTopVideos(points, xMetric, yMetric) {

      const rows = [...points]

    function findCorrelationPoint(event) {
      const canvas = $('#correlation-canvas');
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (event.clientX - rect.left) * scaleX;
      const y = (event.clientY - rect.top) * scaleY;

      return state.correlationPoints.find((item) => {
        if (item.hitType === 'bin') {
          return (
            x >= item.left &&
            x <= item.left + item.width &&
            y >= item.top &&
            y <= item.top + item.height
          );
        }

        const dx = item.cx - x;
        const dy = item.cy - y;
        return Math.sqrt((dx * dx) + (dy * dy)) <= 8;
      });
    }

    function hideCorrelationTooltip() {
      $('#correlation-tooltip').hidden = true;
    }

    async function renderCorrelation() {
      if (!state.conn) return;

      const xMetric = $('#x-metric').value;
      const yMetric = $('#y-metric').value;
      const colorMetric = $('#color-metric').value;

      if (!BI_METRICS[xMetric] || !BI_METRICS[yMetric]) {
        throw new Error('Invalid metric selection.');
      }

      const rows = arrowRows(await state.conn.query(`
        SELECT
          video_id,
          title,
          published_at,
          video_type,
          ${colorMetric} AS color_value,
          ${xMetric} AS x_value,
          ${yMetric} AS y_value
        FROM videos_bi
        ${getBiWhereSql(xMetric, yMetric)}
        ORDER BY view_count_num DESC NULLS LAST
      `));
      const points = rows
        .map((row) => ({
          videoId: row.video_id,
          videoUrl: row.video_id ? `https://www.youtube.com/watch?v=${row.video_id}` : '',
          title: row.title,
          publishedAt: row.published_at,
          videoType: row.video_type,
          colorValue: row.color_value,
          xRaw: row.x_value,
          yRaw: row.y_value,
          xPlot: getMetricValue(row.x_value),
          yPlot: getMetricValue(row.y_value)
        }))
        .filter((point) => point.xPlot !== null && point.yPlot !== null);
      const visiblePoints = points;
      const correlation = calculatePearson(visiblePoints);

      $('#corr-n').textContent = visiblePoints.length.toLocaleString('ja-JP');
      $('#corr-r').textContent = correlation === null
        ? '-'
        : correlation.toLocaleString('ja-JP', { maximumFractionDigits: 3 });
      $('#bi-summary').textContent = `${BI_METRICS[xMetric].label} x ${BI_METRICS[yMetric].label} | n=${visiblePoints.length.toLocaleString('ja-JP')}`;

      if ($('#plot-mode').value === 'density') {
        drawDensity(visiblePoints, xMetric, yMetric);
      } else {
        drawScatter(visiblePoints, xMetric, yMetric);
      }
      renderTopVideos(visiblePoints, xMetric, yMetric);
    }

    async function loadSpreadsheet(options = {}) {
      const { clearCache = false } = options;
      const timings = {};
      const totalStart = performance.now();
      let renderedFromCache = false;

      $('#load-button').disabled = true;
      $('#refresh-button').disabled = true;
      setPagerButtonsDisabled(true);
      $('#live-filter').disabled = true;
      $('#page-size-select').disabled = true;
      $('#tbody').innerHTML = '<tr><td class="empty" colspan="8">読み込み中...</td></tr>';

      try {
        if (state.conn) {
          await state.conn.close();
          state.conn = null;
        }

        if (clearCache) {
          setStatus('キャッシュをクリアして再読み込み中...', { type: 'loading' });
          await measureTiming(timings, 'clearCache', () => clearCachedDataset());
        }

        const cachedRecord = clearCache
          ? null
          : await measureTiming(timings, 'readCache', () => readCachedDataset());

        if (cachedRecord) {
          setStatus('キャッシュから表示中。最新確認中...', { type: 'loading' });
          const cachedDataset = cachedRecordToDataset(cachedRecord);
          const db = state.db || await measureTiming(timings, 'createDuckDB', () => createDuckDB());

          state.db = db;
          await loadDatasetIntoDuckDB(cachedDataset, timings);
          timings.total = performance.now() - totalStart;
          renderedFromCache = true;
          logLoadTimings(timings, cachedDataset);
          setStatus(`キャッシュから表示中。最新確認中。${formatLoadTimingStatus(timings, cachedDataset)}`, { type: 'loading' });
        }

        const manifest = renderedFromCache
          ? await measureTiming(timings, 'getDatasetManifest', () => gasRun('getDatasetManifest'))
          : null;

        if (renderedFromCache && isCachedDatasetFresh(cachedRecord, manifest)) {
          timings.total = performance.now() - totalStart;
          state.dataset.serverTimingsMs = manifest.serverTimingsMs;
          logLoadTimings(timings, state.dataset);
          setStatus(`最新確認済み。${formatLoadTimingStatus(timings, state.dataset)}`, { type: 'success' });
          return;
        }

        setStatus(renderedFromCache ? '更新データを読み込み中...' : 'CSV読み込みとDuckDB-Wasm初期化中...', { type: 'loading' });
        const datasetPromise = measureTiming(timings, 'getDatasetCsv', () => gasRun('getDatasetCsv'));
        const dbPromise = state.db
          ? Promise.resolve(state.db)
          : measureTiming(timings, 'createDuckDB', () => createDuckDB());
        const [dataset, db] = await Promise.all([datasetPromise, dbPromise]);

        state.db = db;
        timings.createDuckDB = timings.createDuckDB || 0;

        await loadDatasetIntoDuckDB(dataset, timings);
        await measureTiming(timings, 'writeCache', () => writeCachedDataset(dataset));

        timings.total = performance.now() - totalStart;
        logLoadTimings(timings, dataset);
        setStatus(`OK: ${state.filteredCount.toLocaleString('ja-JP')} 件を読み込みました。${formatLoadTimingStatus(timings, dataset)}`, { type: 'success' });
      } finally {
        if (state.conn) {
          renderPager();
        }

        $('#load-button').disabled = false;
        $('#refresh-button').disabled = false;
        $('#live-filter').disabled = false;
        $('#page-size-select').disabled = false;
      }
    }

    async function loadDatasetIntoDuckDB(dataset, timings) {
      if (state.conn) {
        await state.conn.close();
        state.conn = null;
      }

      setStatus('CSVをDuckDB-Wasmに登録中...', { type: 'loading' });
      await measureTiming(timings, 'registerFileText', () => state.db.registerFileText(CSV_PATH, dataset.csv));

      setStatus('DuckDB connectionを作成中...', { type: 'loading' });
      state.conn = await measureTiming(timings, 'connect', () => state.db.connect());

      setStatus('read_csv_autoでviewを作成中...', { type: 'loading' });
      await measureTiming(timings, 'createVideosView', () => state.conn.query(`
        CREATE OR REPLACE VIEW videos AS
        SELECT *
        FROM read_csv_auto('${CSV_PATH}', header = true)
      `));
      await measureTiming(timings, 'createBiView', () => createBiView());

      state.dataset = dataset;

      await measureTiming(timings, 'refreshCounts', () => refreshCounts());
      await measureTiming(timings, 'refreshFilterOptions', () => refreshFilterOptions());
      $('#live-filter').value = state.filterValue;
      renderCorrelationTemplates();
      await measureTiming(timings, 'refreshBiFilterOptions', () => refreshBiFilterOptions());
      await measureTiming(timings, 'renderPage', () => renderPage(1));
      await measureTiming(timings, 'renderCorrelation', () => renderCorrelation());
    }

    async function refreshFromYouTube() {
      $('#load-button').disabled = true;
      $('#refresh-button').disabled = true;
      setPagerButtonsDisabled(true);
      $('#live-filter').disabled = true;
      $('#page-size-select').disabled = true;

      try {
        setStatus('YouTubeから全データ再取得中...', { type: 'loading' });
        await gasRun('manualRefresh');
        await loadSpreadsheet();
      } finally {
        if (state.conn) {
          renderPager();
        }

        $('#load-button').disabled = false;
        $('#refresh-button').disabled = false;
        $('#live-filter').disabled = false;
        $('#page-size-select').disabled = false;
      }
    }

    function handleError(error, clearRows = true) {
      console.error(error);
      setStatus(`ERROR: ${error.message || error}`, { type: 'error' });

      if (clearRows) {
        $('#tbody').innerHTML = '<tr><td class="empty" colspan="8">読み込みに失敗しました。</td></tr>';
      }
    }

    function switchView(viewName) {
      state.currentView = viewName;
      $('#list-view').classList.toggle('view-hidden', viewName !== 'list');
      $('#bi-view').classList.toggle('view-hidden', viewName !== 'bi');
      document.querySelectorAll('.nav-item[data-view]').forEach((item) => {
        item.classList.toggle('active', item.dataset.view === viewName);
      });

      if (viewName === 'bi') {
        document.querySelectorAll('.nav-item[data-filter]').forEach((item) => {
          item.classList.remove('active');
        });
        renderCorrelation().catch(handleError);
      } else {
        renderCounts();
      }
    }

    $('#load-button').addEventListener('click', () => {
      loadSpreadsheet({ clearCache: true }).catch(handleError);
    });

    $('#refresh-button').addEventListener('click', () => {
      refreshFromYouTube().catch((error) => handleError(error, false));
    });

    document.querySelectorAll('[data-page-action]').forEach((button) => {
      button.addEventListener('click', () => {
        const delta = button.dataset.pageAction === 'prev' ? -1 : 1;
        renderPage(state.currentPage + delta).catch(handleError);
      });
    });

    $('#page-size-select').addEventListener('change', () => {
      state.pageSize = Number($('#page-size-select').value);
      state.currentPage = 1;
      if (!state.conn) return;

      refreshCounts()
        .then(() => renderPage(1))
        .catch(handleError);
    });

    $('#live-filter').addEventListener('change', () => {
      state.filterValue = $('#live-filter').value;
      state.currentPage = 1;

      refreshCounts()
        .then(() => renderPage(1))
        .catch(handleError);
    });

    document.querySelectorAll('th[data-sort-key]').forEach((header) => {
      header.addEventListener('click', () => {
        if (!state.conn) return;

        const key = header.dataset.sortKey;
        if (!SORT_COLUMNS[key]) return;

        if (state.sortKey === key) {
          state.sortDirection = state.sortDirection === 'asc' ? 'desc' : 'asc';
        } else {
          state.sortKey = key;
          state.sortDirection = SORT_COLUMNS[key].defaultDirection;
        }

        state.currentPage = 1;
        renderSortHeaders();
        renderPage(1).catch(handleError);
      });

      header.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          event.currentTarget.click();
        }
      });
    });

    function selectFilter(value) {
      if (!state.conn) return;

      state.filterValue = value;
      state.currentPage = 1;
      $('#live-filter').value = value;
      switchView('list');

      refreshCounts()
        .then(() => renderPage(1))
        .catch(handleError);
    }

    document.querySelectorAll('.nav-item[data-filter]').forEach((item) => {
      item.addEventListener('click', () => {
        selectFilter(item.dataset.filter);
      });

      item.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          selectFilter(item.dataset.filter);
        }
      });
    });

    document.querySelectorAll('.nav-item[data-view]').forEach((item) => {
      item.addEventListener('click', () => {
        switchView(item.dataset.view);
      });

      item.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          switchView(item.dataset.view);
        }
      });
    });

    $('#bi-list-button').addEventListener('click', () => {
      switchView('list');
    });

    $('#correlation-templates').addEventListener('click', (event) => {
      const button = event.target.closest('[data-template-id]');
      if (!button) return;

      const template = CORRELATION_TEMPLATES.find((item) => item.id === button.dataset.templateId);
      if (template) {
        applyCorrelationTemplate(template);
      }
    });

    $('#run-correlation').addEventListener('click', () => {
      state.activeCorrelationTemplate = '';
      renderCorrelationTemplates();
      renderCorrelation().catch(handleError);
    });

    ['x-metric', 'y-metric', 'color-metric', 'plot-mode'].forEach((id) => {
      $(`#${id}`).addEventListener('change', () => {
        state.activeCorrelationTemplate = '';
        renderCorrelationTemplates();
        renderCorrelation().catch(handleError);
      });
    });

    ['bi-filter', 'published-year-filter', 'published-hour-filter'].forEach((id) => {
      $(`#${id}`).addEventListener('change', () => {
        state.activeCorrelationTemplate = '';
        renderCorrelationTemplates();
        renderCorrelation().catch(handleError);
      });
    });

    $('#bi-keyword').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        renderCorrelation().catch(handleError);
      }
    });

    ['duration-start', 'duration-end'].forEach((id) => {
      $(`#${id}`).addEventListener('input', () => {
        updateDurationSliderLabels();
        renderCorrelation().catch(handleError);
      });
    });

    ['duration-start', 'duration-end'].forEach((id) => {
      $(`#${id}-label`).addEventListener('change', () => {
        setDurationFromInput(id);
      });

      $(`#${id}-label`).addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.currentTarget.blur();
        }
      });
    });

    $('#clear-duration-filter').addEventListener('click', () => {
      resetDurationFilter();
      renderCorrelation().catch(handleError);
    });

    ['published-date-start', 'published-date-end'].forEach((id) => {
      $(`#${id}`).addEventListener('input', () => {
        updatePublishedDateSliderLabels();
        renderCorrelation().catch(handleError);
      });
    });

    ['published-date-start', 'published-date-end'].forEach((id) => {
      $(`#${id}-label`).addEventListener('change', () => {
        setPublishedDateFromInput(id);
      });

      $(`#${id}-label`).addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.currentTarget.blur();
        }
      });
    });

    $('#clear-published-date-filter').addEventListener('click', () => {
      resetPublishedDateFilter();
      renderCorrelation().catch(handleError);
    });

    $('#tbody').addEventListener('click', (event) => {
      const row = event.target.closest('tr[data-video-url]');
      const url = row?.dataset.videoUrl;

      if (url) {
        window.open(url, '_blank', 'noopener');
      }
    });

    $('#tbody').addEventListener('keydown', (event) => {
      if (event.key !== 'Enter') return;

      const row = event.target.closest('tr[data-video-url]');
      const url = row?.dataset.videoUrl;

      if (url) {
        window.open(url, '_blank', 'noopener');
      }
    });

    $('#correlation-top-videos').addEventListener('click', (event) => {
      const row = event.target.closest('tr[data-video-url]');
      const url = row?.dataset.videoUrl;

      if (url) {
        window.open(url, '_blank', 'noopener');
      }
    });

    $('#correlation-canvas').addEventListener('click', (event) => {
      const hit = findCorrelationPoint(event);

      if (hit?.videoUrl) {
        window.open(hit.videoUrl, '_blank', 'noopener');
      }
    });

    $('#correlation-canvas').addEventListener('mousemove', (event) => {
      const hit = findCorrelationPoint(event);

      if (hit) {
        event.currentTarget.style.cursor = hit.videoUrl ? 'pointer' : 'default';
        showCorrelationTooltip(event, hit);
      } else {
        event.currentTarget.style.cursor = 'default';
        hideCorrelationTooltip();
      }
    });

    $('#correlation-canvas').addEventListener('mouseleave', () => {
      hideCorrelationTooltip();
    });

    initializeBiControls();
    loadSpreadsheet().catch(handleError);
  </script>
